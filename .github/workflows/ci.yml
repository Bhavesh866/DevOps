
name: validate-and-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure and manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infra/providers/aws fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/providers/aws init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/providers/aws validate

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Validate Kubernetes manifests
        run: bash scripts/validate-manifests.sh

      - name: Validate network inputs
        run: python3 scripts/validate-network-inputs.py

      - name: Build synthetic test harness
        run: docker build -t continuity-harness:ci tests/harness

      - name: Scan synthetic harness image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: continuity-harness:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table