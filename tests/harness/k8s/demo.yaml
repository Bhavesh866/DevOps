apiVersion: v1
kind: Namespace
metadata:
  name: continuity-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-api
  namespace: continuity-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synthetic-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: synthetic-api
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: continuity-harness:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ROLE
              value: api
            - name: APP_VERSION
              value: synthetic-v1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-api
  namespace: continuity-demo
spec:
  selector:
    app: synthetic-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-worker
  namespace: continuity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-worker
  template:
    metadata:
      labels:
        app: synthetic-worker
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: continuity-harness:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: worker
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
