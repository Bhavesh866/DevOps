# Synthetic test environment for kind. Not the assignment application and not
# production configuration: Redis here is ephemeral (no persistence, no auth).
apiVersion: v1
kind: Namespace
metadata:
  name: continuity-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: continuity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: continuity-demo
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: synthetic-api
  namespace: continuity-demo
spec:
  selector:
    app: synthetic-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-worker
  namespace: continuity-demo
spec:
  # Replica count is owned by the KEDA ScaledObject in autoscaling.yaml.
  selector:
    matchLabels:
      app: synthetic-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: synthetic-worker
        tenant: shared
        tier: shared
    spec:
      # Longest job (60s) < drain budget (75s) < grace period (90s).
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: continuity-harness:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: worker
            - name: APP_VERSION
              value: synthetic-v1
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WORKER_DRAIN_TIMEOUT_SECONDS
              value: "75"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-exporter
  namespace: continuity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-exporter
  template:
    metadata:
      labels:
        app: queue-exporter
        tenant: shared
        tier: shared
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: continuity-harness:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: queue-exporter
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Scaled to 0; tests scale it up to generate jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-producer
  namespace: continuity-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: synthetic-producer
  template:
    metadata:
      labels:
        app: synthetic-producer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: continuity-harness:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: producer
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: JOBS_PER_SECOND
              value: "5.56"
            - name: JOB_SECONDS_MIN
              value: "5"
            - name: JOB_SECONDS_MAX
              value: "60"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
