# app-secrets is synced from AWS Secrets Manager by External Secrets Operator.
# The ClusterSecretStore "aws-secrets-manager" is created by the platform layer
# per cluster (region + IRSA role from Terraform output secret_reader_role).
# The tenant overlay rewrites the remote key to <tenant>/prod/app-secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: app-secrets, namespace: continuity}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: app-secrets, creationPolicy: Owner}
  dataFrom:
  - extract: {key: REPLACED_BY_TENANT_OVERLAY}
